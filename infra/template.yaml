AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SAM template for AirBuddi IoT -> Lambda -> DynamoDB -> API

Globals:
  Function:
    Timeout: 10

Resources:
  # Auto-confirm user signups
  PreSignUpAutoConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      InlineCode: |
        exports.handler = async (event) => {
          event.response.autoConfirmUser = true;
          return event;
        };

  # Main Cognito User Pool
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: AirBuddiUsers
      UsernameConfiguration:
        CaseSensitive: false
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: false
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpAutoConfirmFunction.Arn

  PreSignUpPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PreSignUpAutoConfirmFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # App Client for mobile app (direct username/password auth)
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: airbuddi-mobile
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  # DynamoDB Table for Telemetry
  TelemetryTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AirBuddiTelemetry
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST

  # Lambda to handle IoT Ingestion & API Gateway queries
  TelemetryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: AirBuddiTelemetryHandler
      Runtime: nodejs20.x
      Handler: index.handler
      InlineCode: |
        const { DynamoDBClient } = require('@aws-sdk/client-dynamodb');
        const { DynamoDBDocumentClient, QueryCommand, PutCommand } = require('@aws-sdk/lib-dynamodb');

        const client = new DynamoDBClient({});
        const ddb = DynamoDBDocumentClient.from(client);

        exports.handler = async (event) => {
          // 1. Ingestion: triggered by IoT Rule
          if (!event.httpMethod && event.deviceId) {
            await ddb.send(new PutCommand({
              TableName: process.env.TABLE_NAME,
              Item: {
                deviceId: event.deviceId,
                timestamp: event.timestamp || new Date().toISOString(),
                ...event
              }
            }));
            return { status: 'success' };
          }

          // 2. Query: triggered by API Gateway GET /telemetry?deviceId=...
          const deviceId = event.queryStringParameters && event.queryStringParameters.deviceId;
          if (!deviceId) {
            return {
              statusCode: 400,
              headers: { 'Access-Control-Allow-Origin': '*' },
              body: JSON.stringify({ message: 'deviceId query param required' })
            };
          }

          const resp = await ddb.send(new QueryCommand({
            TableName: process.env.TABLE_NAME,
            KeyConditionExpression: 'deviceId = :d',
            ExpressionAttributeValues: { ':d': deviceId },
            ScanIndexForward: false,
            Limit: 1,
          }));

          const item = resp.Items && resp.Items[0];
          return {
            statusCode: 200,
            headers: {
              'Content-Type': 'application/json',
              'Access-Control-Allow-Origin': '*'
            },
            body: JSON.stringify(item || {})
          };
        };
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:Query
                - dynamodb:PutItem
              Resource: !GetAtt TelemetryTable.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref TelemetryTable
      Events:
        TelemetryApi:
          Type: Api
          Properties:
            Path: /telemetry
            Method: get

  LambdaInvokePermissionFromIot:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt TelemetryFunction.Arn
      Action: lambda:InvokeFunction
      Principal: iot.amazonaws.com

  IotTopicRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: AirBuddiForwardRule
      TopicRulePayload:
        Sql: "SELECT * FROM 'airbuddi/+/telemetry'"
        Actions:
          - Lambda:
              FunctionArn: !GetAtt TelemetryFunction.Arn
        RuleDisabled: false
        AwsIotSqlVersion: '2016-03-23'

Outputs:
  CognitoUserPoolId:
    Description: Cognito user pool for AirBuddi customer accounts
    Value: !Ref UserPool
  CognitoUserPoolClientId:
    Description: Copy this value into src/config/authConfig.ts
    Value: !Ref UserPoolClient
  TelemetryApi:
    Description: Base URL for telemetry API
    Value: !Sub 'https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/telemetry'